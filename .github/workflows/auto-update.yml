name: Auto-Update Cinemana Catalogs & Collections

on:
  schedule:
    # Runs automatically every 1 hour to fetch the latest source updates & Cinemana catalogs
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "providers/**"
      - ".github/workflows/auto-update.yml"

permissions:
  contents: write

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync latest Providers, Catalogs & Collections from source
        run: node scripts/sync-from-source.js

      - name: Run Provider & Schema Tests
        run: node scripts/test-provider.js

      - name: Commit and Push updated catalogs & collections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json repo.json plugins.json nuvio-collections.json addon/ data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(sync): auto-update Cinemana catalogs, collections & provider manifest"
            git push
          fi
