name: Auto-Update Catalogs & Collections

on:
  schedule:
    # Every 15 minutes (GitHub may delay scheduled runs by a few minutes under load)
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "providers/**"
      - ".github/workflows/auto-update.yml"

permissions:
  contents: write

# Never run two syncs at once; a queued run waits instead of racing on git push.
concurrency:
  group: arabic-nuvio-sync
  cancel-in-progress: false

jobs:
  sync-and-publish:
    # Set the repository variable SYNC_RUNNER to "self-hosted" to run on your own (e.g. Iraqi) machine,
    # which can reach sites that block GitHub's servers (Cinemana, CEE and several anime sites).
    runs-on: ${{ vars.SYNC_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Unit tests (merge / dedupe / paging / episodes / stream lookup)
        run: |
          node scripts/test-store.js
          node scripts/test-episodes.js
          node scripts/test-episode-streams.js
          node scripts/test-direct-streams.js
          node scripts/test-embeds.js

      - name: Sync latest providers, catalogs & collections from every source
        run: node scripts/sync-from-source.js

      - name: Verify catalogs (no duplicates, paging consistent, collections valid)
        run: node scripts/verify-catalogs.js

      - name: Provider stream tests (informational, never blocks publishing)
        continue-on-error: true
        run: node scripts/test-provider.js

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json repo.json plugins.json nuvio-collections.json addon/ data/ providers/
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(sync): auto-update catalogs, collections & provider manifest"
          for attempt in 1 2 3 4; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt) - rebasing"
            git pull --rebase --autostash -X theirs origin main || git rebase --abort
            sleep $((attempt * 5))
          done
          echo "could not push after retries" && exit 1
